[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "vllm-gradio-gui"
version = "0.1.0"
description = "Gradio demo for the local vLLM inference platform"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.112.0,<0.116.0",
  "gradio>=4.14.0,<5.0.0",
  "huggingface_hub==0.25.2",
  "openai>=1.0.0,<2.0.0",
  "starlette>=0.37.2,<0.41.0",
]

[tool.hatch.build.targets.wheel]
include = ["main.py"]