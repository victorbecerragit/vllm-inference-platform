services:
  vllm:
    image: ${VLLM_IMAGE:-public.ecr.aws/q9t5s3a7/vllm-cpu-release-repo:latest}
    container_name: vllm-engine
    environment:
      - HF_HOME=/root/.cache/huggingface
      - OMP_NUM_THREADS=${OMP_NUM_THREADS:-4}
      - VLLM_CPU_KVCACHE_SPACE=${VLLM_CPU_KVCACHE_SPACE:-4}
      - VLLM_TARGET_DEVICE=cpu
    command: >
      ${MODEL_NAME:-Qwen/Qwen2.5-0.5B-Instruct}
      --port 8000
      --max-model-len ${MAX_MODEL_LEN:-1024}
      --dtype float32
      --enforce-eager
    expose:
      - "8000"
    ports:
      - "${VLLM_HOST_PORT:-8002}:8000"
    volumes:
      - vllm-cache:/root/.cache/huggingface
      - /dev/shm:/dev/shm
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 5m
    restart: unless-stopped
    networks:
      - inference-net

  redis:
    image: redis:7-alpine
    container_name: redis-cache
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped
    networks:
      - inference-net

  litellm:
    image: ghcr.io/berriai/litellm:main-latest
    container_name: litellm-proxy
    command:
      - --config
      - /app/config.yaml
      - --port
      - "4000"
      - --num_workers
      - "1"
    environment:
      - LITELLM_MASTER_KEY=${LITELLM_MASTER_KEY:-secret-api-key}
      - LITELLM_LOG=INFO
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_URL=redis://redis:6379/0
    expose:
      - "4000"
    ports:
      - "${LITELLM_PORT:-4000}:4000"
    volumes:
      - ./config/litellm/config.yaml:/app/config.yaml:ro
    depends_on:
      vllm:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import os, urllib.request; key=os.getenv('LITELLM_MASTER_KEY','secret-api-key'); req=urllib.request.Request('http://localhost:4000/health/liveliness', headers={'Authorization': f'Bearer {key}'}); urllib.request.urlopen(req, timeout=3)\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped
    networks:
      - inference-net

  fallback-mock:
    build:
      context: ./apps/fallback-mock
      dockerfile: Dockerfile
    container_name: fallback-mock
    expose:
      - "8080"
    ports:
      - "${FALLBACK_MOCK_PORT:-8088}:8080"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8080/health', timeout=3)\" || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    restart: unless-stopped
    networks:
      - inference-net

  kong:
    image: ${KONG_IMAGE:-kong/kong-gateway:3.13}
    container_name: kong-gateway
    environment:
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: /usr/local/kong/declarative/kong.yml
      KONG_PROXY_ACCESS_LOG: /dev/stdout
      KONG_ADMIN_ACCESS_LOG: /dev/stdout
      KONG_PROXY_ERROR_LOG: /dev/stderr
      KONG_ADMIN_ERROR_LOG: /dev/stderr
      KONG_ADMIN_LISTEN: 0.0.0.0:8001
      KONG_PROXY_LISTEN: 0.0.0.0:8000
      KONG_PLUGINS: bundled
    volumes:
      - ./config/kong/kong.yml:/usr/local/kong/declarative/kong.yml:ro
    ports:
      - "${KONG_PROXY_PORT:-8000}:8000"
      - "${KONG_ADMIN_PORT:-8001}:8001"
    depends_on:
      litellm:
        condition: service_healthy
      fallback-mock:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "kong health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    networks:
      - inference-net

  gradio-gui:
    build:
      context: ./apps/gradio-gui
      dockerfile: Dockerfile
    container_name: vllm-gradio-gui
    ports:
      - "7860:7860"
    environment:
      - VLLM_API_BASE=http://kong:8000/v1
      - VLLM_API_KEY=${VLLM_API_KEY:-secret-api-key}
      - GRADIO_VERBOSE=${GRADIO_VERBOSE:-true}
    depends_on:
      kong:
        condition: service_healthy
    networks:
      - inference-net

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.enable-lifecycle
    volumes:
      - ./config/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    depends_on:
      - vllm
      - kong
    restart: unless-stopped
    networks:
      - inference-net

  jaeger:
    image: jaegertracing/all-in-one:1.59
    container_name: jaeger
    environment:
      - COLLECTOR_OTLP_ENABLED=true
    expose:
      - "4317"
      - "4318"
      - "16686"
    ports:
      - "16686:16686"
    restart: unless-stopped
    networks:
      - inference-net

  otel-collector:
    image: otel/opentelemetry-collector-contrib:latest
    container_name: otel-collector
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    volumes:
      - ./config/otel/otel-collector-config.yaml:/etc/otelcol-contrib/config.yaml:ro
    ports:
      - "4317:4317"
      - "${OTEL_COLLECTOR_PORT:-4318}:4318"
      - "8889:8889"
    depends_on:
      jaeger:
        condition: service_started
    restart: unless-stopped
    networks:
      - inference-net

  grafana:
    image: grafana/grafana-oss:latest
    container_name: grafana
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - ./config/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./config/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    depends_on:
      - prometheus
    restart: unless-stopped
    networks:
      - inference-net

volumes:
  vllm-cache:
    name: vllm-model-cache
  prometheus-data:
    name: prometheus-storage
  redis-data:
    name: redis-cache-storage

networks:
  inference-net:
    name: vllm-inference-platform-net
    driver: bridge
