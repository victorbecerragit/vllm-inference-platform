kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
nodes:
  - role: control-plane
    image: kindest/node:v1.33.1
    kubeadmConfigPatches:
      - |
        kind: InitConfiguration
        nodeRegistration:
          kubeletExtraArgs:
            node-labels: "ingress-ready=true"
    extraPortMappings:
      - containerPort: 80
        hostPort: 80
        protocol: TCP
      - containerPort: 443
        hostPort: 443
        protocol: TCP
      - containerPort: 8080
        hostPort: 8080
        protocol: TCP
      - containerPort: 30080
        hostPort: ${KIND_KONG_PROXY_PORT}
        protocol: TCP
      - containerPort: 30081
        hostPort: ${KIND_KONG_ADMIN_PORT}
        protocol: TCP
      - containerPort: 30082
        hostPort: ${KIND_GRADIO_PORT}
        protocol: TCP
    extraMounts:
      - hostPath: /var/lib/kind/images/control-plane-1
        containerPath: /var/lib/containerd
      - hostPath: /tmp/loca-repo
        containerPath: /mnt/local-repo.git
        readOnly: true
  - role: worker
    labels:
      node-role.kubernetes.io/worker: ""
    image: kindest/node:v1.33.1
    kubeadmConfigPatches:
      - |
        kind: JoinConfiguration
        nodeRegistration:
          kubeletExtraArgs:
            node-labels: "topology.kubernetes.io/zone=region1-zone1"
    extraMounts:
      - hostPath: /var/lib/kind/images/worker-1
        containerPath: /var/lib/containerd
  - role: worker
    labels:
      node-role.kubernetes.io/worker: ""
    image: kindest/node:v1.33.1
    kubeadmConfigPatches:
      - |
        kind: JoinConfiguration
        nodeRegistration:
          kubeletExtraArgs:
            node-labels: "topology.kubernetes.io/zone=region1-zone2"
    extraMounts:
      - hostPath: /var/lib/kind/images/worker-2
        containerPath: /var/lib/containerd

