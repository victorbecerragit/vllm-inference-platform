global:
  scrape_interval: 5s
  evaluation_interval: 5s
  scrape_timeout: 4s

scrape_configs:
  - job_name: "vllm"
    metrics_path: /metrics
    static_configs:
      - targets: ["vllm:8000"]
        labels:
          service: "vllm-engine"
          engine: "vllm"
          mode: "cpu"

  - job_name: "kong"
    metrics_path: /metrics
    static_configs:
      - targets: ["kong:8001"]
        labels:
          service: "kong-ai-gateway"
          tier: "gateway"

  - job_name: "otel-collector"
    metrics_path: /metrics
    static_configs:
      - targets: ["otel-collector:8889"]
        labels:
          service: "otel-collector"
          tier: "observability"