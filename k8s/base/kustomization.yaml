apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: vllm-inference-platform

resources:
  - namespace.yaml
  - deployment-vllm.yaml
  - service-vllm.yaml
  - deployment-fallback-mock.yaml
  - service-fallback-mock.yaml
  - deployment-redis.yaml
  - service-redis.yaml
  - deployment-kong.yaml
  - service-kong.yaml
  - deployment-gradio.yaml
  - service-gradio.yaml
  - deployment-prometheus.yaml
  - service-prometheus.yaml
  - deployment-jaeger.yaml
  - service-jaeger.yaml
  - deployment-otel.yaml
  - service-otel.yaml
  - deployment-grafana.yaml
  - service-grafana.yaml

configMapGenerator:
  - name: kong-config
    files:
      - kong.yml=kong.yml
    options:
      disableNameSuffixHash: true
  - name: prometheus-config
    files:
      - prometheus.yml=prometheus.yml
    options:
      disableNameSuffixHash: true
  - name: otel-collector-config
    files:
      - config.yaml=otel-collector-config.yaml
    options:
      disableNameSuffixHash: true
  - name: grafana-datasources
    files:
      - datasources.yaml=grafana-datasources.yaml
    options:
      disableNameSuffixHash: true
  - name: grafana-dashboards-provider
    files:
      - dashboards.yaml=grafana-dashboards.yaml
    options:
      disableNameSuffixHash: true
  - name: grafana-dashboard-observability
    files:
      - inference-observability.json=grafana-dashboard-inference-observability.json
    options:
      disableNameSuffixHash: true

labels:
  - pairs:
      app.kubernetes.io/part-of: vllm-inference-platform
      app.kubernetes.io/managed-by: kustomize