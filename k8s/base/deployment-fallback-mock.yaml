apiVersion: apps/v1
kind: Deployment
metadata:
  name: fallback-mock
  namespace: vllm-inference-platform
spec:
  replicas: 1
  selector:
    matchLabels:
      app: fallback-mock
  template:
    metadata:
      labels:
        app: fallback-mock
    spec:
      containers:
        - name: fallback-mock
          image: python:3.11-slim
          imagePullPolicy: IfNotPresent
          command:
            - python
            - -c
            - |
              import json
              import os
              from urllib import error
              from urllib import request
              from http.server import BaseHTTPRequestHandler
              from http.server import HTTPServer


              PRIMARY_HEALTH_URL = os.getenv("PRIMARY_HEALTH_URL", "http://vllm:8000/health")


              def primary_is_healthy() -> bool:
                  req = request.Request(PRIMARY_HEALTH_URL, method="GET")
                  try:
                      with request.urlopen(req, timeout=0.8) as resp:
                          return 200 <= int(resp.status) < 500
                  except (error.URLError, error.HTTPError, TimeoutError):
                      return False


              class Handler(BaseHTTPRequestHandler):
                  def _normalized_path(self) -> str:
                      path = self.path.split("?", 1)[0]
                      while "//" in path:
                          path = path.replace("//", "/")
                      if len(path) > 1 and path.endswith("/"):
                          path = path[:-1]
                      return path

                  def _write_json(self, status_code: int, payload: dict) -> None:
                      body = json.dumps(payload).encode("utf-8")
                      self.send_response(status_code)
                      self.send_header("Content-Type", "application/json")
                      self.send_header("Content-Length", str(len(body)))
                      self.end_headers()
                      self.wfile.write(body)

                  def _read_json(self) -> dict:
                      length = int(self.headers.get("Content-Length", "0"))
                      if length == 0:
                          return {}
                      raw = self.rfile.read(length)
                      try:
                          return json.loads(raw.decode("utf-8"))
                      except Exception:
                          return {}

                  def do_GET(self) -> None:
                      req_path = self._normalized_path()

                      if req_path == "/readyz":
                          self._write_json(
                              200,
                              {
                                  "status": "ok",
                                  "source": "fallback-mock",
                                  "path": req_path,
                              },
                          )
                          return

                      if req_path == "/health":
                          if primary_is_healthy():
                              self._write_json(
                                  503,
                                  {
                                      "status": "standby",
                                      "source": "fallback-mock",
                                      "path": req_path,
                                      "reason": "primary-healthy",
                                  },
                              )
                              return
                          self._write_json(
                              200,
                              {
                                  "status": "ok",
                                  "source": "fallback-mock",
                                  "path": req_path,
                                  "reason": "primary-unhealthy",
                              },
                          )
                          return

                      if req_path == "/v1/models":
                          self._write_json(
                              200,
                              {
                                  "status": "ok",
                                  "source": "fallback-mock",
                                  "path": req_path,
                              },
                          )
                          return

                      self._write_json(404, {"error": "not found"})

                  def do_POST(self) -> None:
                      req_path = self._normalized_path()

                      if req_path == "/v1/chat/completions":
                          if primary_is_healthy():
                              self._write_json(
                                  503,
                                  {
                                      "error": "fallback-standby",
                                      "reason": "primary-healthy",
                                  },
                              )
                              return

                          data = self._read_json()
                          model = data.get("model", "fallback-mock")
                          prompt_preview = ""
                          messages = data.get("messages", [])
                          if isinstance(messages, list) and messages:
                              last = messages[-1]
                              if isinstance(last, dict):
                                  prompt_preview = str(last.get("content", ""))[:200]
                          self._write_json(
                              200,
                              {
                                  "id": "chatcmpl-fallback",
                                  "object": "chat.completion",
                                  "created": 0,
                                  "model": model,
                                  "choices": [
                                      {
                                          "index": 0,
                                          "finish_reason": "stop",
                                          "message": {
                                              "role": "assistant",
                                              "content": "Fallback response from Kubernetes mock backend.",
                                          },
                                      }
                                  ],
                                  "usage": {
                                      "prompt_tokens": len(prompt_preview.split()),
                                      "completion_tokens": 7,
                                      "total_tokens": len(prompt_preview.split()) + 7,
                                  },
                                  "fallback": True,
                              },
                          )
                          return

                      self._write_json(404, {"error": "not found"})

                  def log_message(self, format, *args):
                      return


              HTTPServer(("0.0.0.0", 8080), Handler).serve_forever()
          ports:
            - containerPort: 8080
              name: http
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8080
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /readyz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 128Mi
