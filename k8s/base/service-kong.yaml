apiVersion: v1
kind: Service
metadata:
  name: kong
  labels:
    app: kong
    app.kubernetes.io/name: kong
    app.kubernetes.io/component: api-gateway
spec:
  type: NodePort
  selector:
    app: kong
  ports:
    - name: proxy
      port: 8000
      targetPort: proxy
      nodePort: 30080
      protocol: TCP
    - name: admin
      port: 8001
      targetPort: admin
      nodePort: 30081
      protocol: TCP