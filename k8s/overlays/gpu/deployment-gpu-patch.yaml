apiVersion: apps/v1
kind: Deployment
metadata:
  name: vllm
spec:
  template:
    spec:
      containers:
        - name: vllm
          image: vllm/vllm-openai:latest
          args:
            - "Qwen/Qwen2.5-0.5B-Instruct"
            - "--port"
            - "8000"
            - "--max-model-len"
            - "4096"
            - "--dtype"
            - "float16"
            - "--gpu-memory-utilization"
            - "0.9"
          env:
            - name: HF_HOME
              value: "/root/.cache/huggingface"
            - name: CUDA_VISIBLE_DEVICES
              value: "0"
            - name: NVIDIA_VISIBLE_DEVICES
              value: "all"
            - name: NVIDIA_DRIVER_CAPABILITIES
              value: "compute,utility"
            - name: VLLM_TARGET_DEVICE
              value: cuda
          resources:
            requests:
              cpu: "2000m"
              memory: "8Gi"
              nvidia.com/gpu: "1"
            limits:
              cpu: "4000m"
              memory: "16Gi"
              nvidia.com/gpu: "1"
