_format_version: "3.0"

# Multi-tenant routing for HAMI vGPU-sliced vLLM deployments.
#
# Clients select a model slice with the `x-model-target` header:
#   x-model-target: qwen2.5   -> vllm-qwen25
#   x-model-target: llama3.2  -> vllm-llama32
#
# Requests without the header fall through to the default route, which
# targets the Qwen slice.

upstreams:
  - name: qwen-upstream
    algorithm: round-robin
    healthchecks:
      active:
        type: http
        http_path: /health
        timeout: 2
        concurrency: 10
        healthy:
          interval: 5
          successes: 1
        unhealthy:
          interval: 5
          http_failures: 2
          tcp_failures: 2
          timeouts: 2
      passive:
        type: http
        healthy:
          successes: 1
          http_statuses:
            - 200
            - 201
            - 202
            - 204
        unhealthy:
          http_failures: 2
          tcp_failures: 2
          timeouts: 2
          http_statuses:
            - 429
            - 500
            - 502
            - 503
            - 504
    targets:
      - target: vllm-qwen25:8000
        weight: 100

  - name: llama-upstream
    algorithm: round-robin
    healthchecks:
      active:
        type: http
        http_path: /health
        timeout: 2
        concurrency: 10
        healthy:
          interval: 5
          successes: 1
        unhealthy:
          interval: 5
          http_failures: 2
          tcp_failures: 2
          timeouts: 2
      passive:
        type: http
        healthy:
          successes: 1
          http_statuses:
            - 200
            - 201
            - 202
            - 204
        unhealthy:
          http_failures: 2
          tcp_failures: 2
          timeouts: 2
          http_statuses:
            - 429
            - 500
            - 502
            - 503
            - 504
    targets:
      - target: vllm-llama32:8000
        weight: 100

services:
  - name: qwen-vllm-service
    protocol: http
    host: qwen-upstream
    port: 80
    path: /
    retries: 2
    connect_timeout: 60000
    read_timeout: 300000
    write_timeout: 300000
    routes:
      # Header-scoped route. Kong prefers routes with more matching
      # attributes, so this wins over the default route below.
      - name: qwen-route
        paths:
          - /v1/chat/completions
        headers:
          x-model-target:
            - qwen2.5
        strip_path: false
        methods:
          - POST
          - OPTIONS
        plugins:
          - name: key-auth
            config:
              key_names:
                - apikey
                - Authorization
              key_in_header: true
              key_in_query: true
              hide_credentials: false

      # Default route: no x-model-target header supplied.
      - name: chat-completions-default
        paths:
          - /v1/chat/completions
        strip_path: false
        methods:
          - POST
          - OPTIONS
        plugins:
          - name: key-auth
            config:
              key_names:
                - apikey
                - Authorization
              key_in_header: true
              key_in_query: true
              hide_credentials: false

      - name: qwen-models
        paths:
          - /v1/models
        strip_path: false
        methods:
          - GET
          - OPTIONS

      - name: qwen-health
        paths:
          - /health
        strip_path: false
        methods:
          - GET

    plugins:
      - name: cors
        config:
          origins:
            - "*"
          methods:
            - GET
            - POST
            - OPTIONS
          headers:
            - Accept
            - Accept-Version
            - Content-Length
            - Content-Type
            - Authorization
            - apikey
            - x-model-target
          exposed_headers:
            - Content-Type
            - Authorization
          credentials: true
          max_age: 3600

      - name: rate-limiting
        config:
          minute: 120
          policy: local
          fault_tolerant: true
          hide_client_headers: false

  - name: llama-vllm-service
    protocol: http
    host: llama-upstream
    port: 80
    path: /
    retries: 2
    connect_timeout: 60000
    read_timeout: 300000
    write_timeout: 300000
    routes:
      - name: llama-route
        paths:
          - /v1/chat/completions
        headers:
          x-model-target:
            - llama3.2
        strip_path: false
        methods:
          - POST
          - OPTIONS
        plugins:
          - name: key-auth
            config:
              key_names:
                - apikey
                - Authorization
              key_in_header: true
              key_in_query: true
              hide_credentials: false

      - name: llama-models
        paths:
          - /v1/models
        headers:
          x-model-target:
            - llama3.2
        strip_path: false
        methods:
          - GET
          - OPTIONS

    plugins:
      - name: cors
        config:
          origins:
            - "*"
          methods:
            - GET
            - POST
            - OPTIONS
          headers:
            - Accept
            - Accept-Version
            - Content-Length
            - Content-Type
            - Authorization
            - apikey
            - x-model-target
          exposed_headers:
            - Content-Type
            - Authorization
          credentials: true
          max_age: 3600

      - name: rate-limiting
        config:
          minute: 120
          policy: local
          fault_tolerant: true
          hide_client_headers: false

consumers:
  - username: platform-user
    keyauth_credentials:
      - key: secret-api-key

plugins:
  - name: prometheus
    config:
      per_consumer: false
      status_code_metrics: true
      latency_metrics: true
      bandwidth_metrics: true
      upstream_health_metrics: true
